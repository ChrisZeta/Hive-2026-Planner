<!DOCTYPE html>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; height: 100%; }
html { background: var(--bg); }

:root[data-theme="dark"] {
  --bg: #080808;
  --bg-header: #0c0c0c;
  --bg-sub: #0a0a0a;
  --bg-status: #090909;
  --bg-surface: rgba(255,255,255,0.03);
  --bg-surface-hover: rgba(255,255,255,0.06);
  --bg-list-item: rgba(255,255,255,0.015);
  --bg-search-dd: #141414;
  --bg-input: rgba(255,255,255,0.05);
  --text: #ffffff;
  --text-strong: #eeeeee;
  --text-mid: #bbbbbb;
  --text-soft: rgba(255,255,255,0.45);
  --text-faint: rgba(255,255,255,0.3);
  --text-ghost: rgba(255,255,255,0.2);
  --border: rgba(255,255,255,0.07);
  --border-soft: rgba(255,255,255,0.05);
  --border-grid: rgba(255,255,255,0.03);
  --scroll-thumb: #2a2a2a;
  --scroll-track: #0d0d0d;
  --sel-check-text: #000000;
  --accent: #FF3B30;
  --live: #FF6B35;
}
:root[data-theme="light"] {
  --bg: #f4f4f5;
  --bg-header: #ffffff;
  --bg-sub: #fafafa;
  --bg-status: #f0f0f1;
  --bg-surface: rgba(0,0,0,0.025);
  --bg-surface-hover: rgba(0,0,0,0.05);
  --bg-list-item: rgba(0,0,0,0.012);
  --bg-search-dd: #ffffff;
  --bg-input: rgba(0,0,0,0.04);
  --text: #0a0a0a;
  --text-strong: #1a1a1a;
  --text-mid: #333333;
  --text-soft: rgba(0,0,0,0.5);
  --text-faint: rgba(0,0,0,0.4);
  --text-ghost: rgba(0,0,0,0.25);
  --border: rgba(0,0,0,0.12);
  --border-soft: rgba(0,0,0,0.08);
  --border-grid: rgba(0,0,0,0.05);
  --scroll-thumb: #c4c4c4;
  --scroll-track: #e8e8e8;
  --sel-check-text: #ffffff;
  --accent: #E5352B;
  --live: #D9531B;
}

body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; overflow-x: hidden; transition: background 0.2s, color 0.2s; min-height: 100vh; }
#app { min-height: 100vh; background: var(--bg); }
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: var(--scroll-track); }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 2px; }
button { cursor: pointer; font-family: inherit; }
input { font-family: inherit; }

.header { padding: 12px 16px 10px; background: var(--bg-header); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 200; }
.header-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
.logo-block { display: flex; flex-direction: column; gap: 2px; }
.logo-line1 { display: flex; align-items: baseline; gap: 9px; }
.logo-hive { font-size: 26px; font-weight: 700; letter-spacing: 4px; color: var(--accent); line-height: 1; }
.logo-fest { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: var(--text-faint); white-space: nowrap; }
.logo-line2 { font-size: 8px; color: var(--text-faint); letter-spacing: 2px; white-space: nowrap; }
.logo-line3 { font-size: 9px; color: var(--text-faint); letter-spacing: 1px; white-space: nowrap; }
.logo-link { color: var(--text-soft); text-decoration: none; border-bottom: 1px solid currentColor; }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.view-btn-hidden { visibility: hidden; pointer-events: none; }
.view-btns { display: flex; gap: 4px; }
.view-btn { padding: 5px 10px; background: var(--bg-surface); border: 1px solid var(--border-soft); border-radius: 5px; color: var(--text-soft); font-size: 8px; font-weight: 700; letter-spacing: 0.5px; }
.view-btn.active { background: var(--accent); color: var(--sel-check-text); border-color: var(--accent); }

.theme-switch { display: flex; gap: 0; background: var(--bg-surface); border: 1px solid var(--border-soft); border-radius: 5px; overflow: hidden; }
.theme-opt { padding: 4px 8px; background: transparent; border: none; color: var(--text-soft); font-size: 11px; display: flex; align-items: center; justify-content: center; line-height: 1; }
.theme-opt.active { background: var(--accent); color: var(--sel-check-text); }

.day-row { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.day-btn { padding: 5px 12px; background: var(--bg-surface); border: 1px solid var(--border-soft); border-radius: 5px; color: var(--text-soft); font-size: 9px; font-weight: 700; letter-spacing: 0.8px; }
.day-btn.active { background: var(--accent); border-color: var(--accent); color: var(--sel-check-text); }
.action-btns { margin-left: auto; display: flex; gap: 6px; }
.action-btn { font-size: 8px; padding: 3px 9px; border-radius: 4px; font-family: monospace; }
.btn-all { background: var(--bg-surface); border: 1px solid var(--border-soft); color: var(--text-soft); }
.btn-clear { background: var(--bg-surface); border: 1px solid var(--border-soft); color: var(--accent); }

.search-bar { padding: 8px 16px; background: var(--bg-sub); border-bottom: 1px solid var(--border-soft); position: relative; }
.search-input { width: 100%; padding: 9px 12px 9px 32px; background: var(--bg-input); border: 1px solid var(--border-soft); border-radius: 6px; color: var(--text); font-size: 16px; outline: none; letter-spacing: 0.3px; }
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text-faint); }
.search-icon { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text-faint); pointer-events: none; }
.search-results { position: absolute; top: 100%; left: 16px; right: 16px; z-index: 300; background: var(--bg-search-dd); border: 1px solid var(--border); border-radius: 6px; max-height: 260px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
.search-result-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border-soft); }
.search-result-item:hover { background: var(--bg-surface-hover); }

.statusbar { padding: 5px 16px; background: var(--bg-status); border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.statusbar-text { font-size: 8px; color: var(--text-faint); letter-spacing: 0.5px; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 3px; }
.legend-dot { width: 6px; height: 6px; border-radius: 1px; flex-shrink: 0; }

.content { overflow: auto; height: calc(100vh - 162px); }
.timeline-wrapper { overflow-x: auto; overflow-y: auto; }
.timeline-inner { min-width: max-content; }
.timeline-header { display: flex; position: sticky; top: 0; z-index: 50; background: var(--bg-status); border-bottom: 1px solid var(--border); }
.hour-cell { flex-shrink: 0; padding: 5px 4px; color: var(--text-faint); font-size: 8px; font-family: monospace; border-left: 1px solid var(--border-grid); }
.stage-row { display: flex; border-bottom: 1px solid var(--border-soft); min-height: 68px; }
.stage-label { flex-shrink: 0; padding: 8px 10px; border-right-width: 2px; border-right-style: solid; display: flex; align-items: center; position: sticky; left: 0; z-index: 10; background: var(--bg); }
.stage-label span { font-size: 8px; font-weight: 700; letter-spacing: 0.8px; line-height: 1.4; }
.sets-area { position: relative; flex-shrink: 0; }
.set-block { position: absolute; top: 4px; bottom: 4px; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; padding: 6px 8px; border-width: 1px; border-style: solid; }
.set-block-inner { display: flex; align-items: center; gap: 5px; min-width: 0; }
.set-name { font-size: 9px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.2px; line-height: 1.2; }
.set-time { font-size: 7px; font-family: monospace; color: var(--text-faint); margin-top: 2px; }
.sel-dot { position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 5px; font-weight: 900; color: var(--sel-check-text); }
.badge-live { font-size: 6px; color: var(--live); font-weight: 700; letter-spacing: 0.8px; }
.avatar { flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: monospace; border: 1.5px solid var(--border); }
.avatar-group { display: flex; flex-shrink: 0; }
.list-empty { padding: 48px 16px; text-align: center; color: var(--text-ghost); }
.list-empty-icon { font-size: 32px; margin-bottom: 12px; }
.list-empty-text { font-size: 10px; line-height: 1.8; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--border-soft); background: var(--bg-list-item); }
.list-time { min-width: 62px; text-align: right; }
.list-time-main { font-size: 12px; font-weight: 700; color: var(--text-strong); }
.list-time-end { font-size: 9px; color: var(--text-faint); font-family: monospace; }
.stage-bar { width: 3px; height: 38px; border-radius: 2px; flex-shrink: 0; }
.list-info { flex: 1; min-width: 0; }
.list-name { font-size: 11px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.3px; }
.list-meta { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.list-stage-name { font-size: 9px; font-family: monospace; font-weight: 600; }
.list-badge { font-size: 8px; color: var(--text-faint); }
.list-badge-live { font-size: 8px; color: var(--live); font-weight: 700; }
.remove-btn { width: 22px; height: 22px; border-radius: 50%; background: var(--bg-surface); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--accent); flex-shrink: 0; }
.thu-list-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
.thu-list-item:hover { background: var(--bg-surface-hover); }
.thu-num { min-width: 22px; font-size: 9px; color: var(--text-ghost); text-align: right; font-family: monospace; }
.thu-name { font-size: 11px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.3px; }
.thu-type { font-size: 8px; color: var(--text-faint); margin-top: 2px; }
.thu-sel-indicator { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 9px; flex-shrink: 0; }
.section-label { padding: 10px 16px 6px; font-size: 8px; color: var(--text-faint); letter-spacing: 1px; border-bottom: 1px solid var(--border-soft); }

.install-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.install-card { background: var(--bg-header); border: 1px solid var(--border); border-radius: 14px; padding: 20px 18px; max-width: 420px; width: 100%; }
.install-title { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: 1px; margin-bottom: 6px; }
.install-text { font-size: 12px; color: var(--text-mid); line-height: 1.6; margin-bottom: 14px; }
.install-steps { font-size: 12px; color: var(--text); line-height: 1.9; margin-bottom: 16px; }
.install-steps b { color: var(--accent); font-weight: 700; }
.install-actions { display: flex; gap: 8px; }
.install-btn { flex: 1; padding: 11px; border-radius: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; border: 1px solid var(--border-soft); }
.install-btn-primary { background: var(--accent); color: var(--sel-check-text); border-color: var(--accent); }
.install-btn-ghost { background: var(--bg-surface); color: var(--text-soft); }
.install-dismiss { display: block; width: 100%; margin-top: 10px; background: none; border: none; color: var(--text-faint); font-size: 10px; text-decoration: underline; }

.full-item { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--border-soft); background: var(--bg-list-item); cursor: pointer; }
.full-item:hover { background: var(--bg-surface-hover); }
.full-sel { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text-ghost); flex-shrink: 0; }
.sort-bar { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--border-soft); background: var(--bg-status); position: sticky; top: 0; z-index: 5; }

.set-past { opacity: 0.32; filter: grayscale(0.6); }

.now-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 6; box-shadow: 0 0 6px var(--accent); }
.now-line::before { content: ""; position: absolute; top: 0; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.now-divider { position: relative; height: 0; border-top: 2px solid var(--accent); margin: 0; box-shadow: 0 0 6px var(--accent); display: flex; align-items: center; }
.now-divider-label { position: absolute; left: 12px; top: -8px; background: var(--accent); color: var(--sel-check-text); font-size: 8px; font-weight: 700; letter-spacing: 1px; padding: 2px 8px; border-radius: 8px; }
.install-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }

.install-btns { display: flex; gap: 8px; margin-top: 16px; }

function getCurrentTheme(){const ds=document.documentElement.getAttribute("data-theme");return ds==="light"?"light":"dark";}
function getStage(id){if(id==="hive_warmup")return THU_STAGE;return STAGES.find(s=>s.id===id)||STAGES[0];}
function toMins(t){const[h,m]=t.split(":").map(Number);return h*60+m;}
function toTime(m){const h=Math.floor(m/60)%24,mn=m%60;return String(h).padStart(2,"0")+":"+String(mn).padStart(2,"0");}
function strColor(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))&0xffffffff;const hue=Math.abs(h)%360;const light=getCurrentTheme()==="light";return`hsl(${hue},${light?65:60}%,${light?42:50}%)`;}
function initials(name){const p=name.replace(/[^a-zA-Z0-9 ]/g,"").split(" ").filter(Boolean);return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():name.slice(0,2).toUpperCase();}
function hexA(hex,a){return hex+a;}
function formatLabel(set,compact){
  if(!set.type||set.artists.length<2)return compact?set.artists.map(a=>a.split(" ")[0]).join("×"):set.artists.join(", ");
  const baseType=set.type.includes("F2F")?"F2F":set.type.includes("B2B")?"B2B":set.type;
  if(compact)return set.artists.map(a=>a.split(" ")[0]).join("×");
  if(set.artists.length===2)return set.artists[0]+" "+baseType+" "+set.artists[1];
  return set.artists.join(" · ");
}

let _idb=null;
function idbOpen(){
  return new Promise((resolve)=>{
    if(_idb)return resolve(_idb);
    if(!("indexedDB" in window))return resolve(null);
    try{
      const req=indexedDB.open("hive2026",1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv");};
      req.onsuccess=()=>{_idb=req.result;resolve(_idb);};
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null);}
  });
}
function idbGet(key){
  return new Promise((resolve)=>{
    idbOpen().then((db)=>{
      if(!db)return resolve(null);
      try{
        const tx=db.transaction("kv","readonly").objectStore("kv").get(key);
        tx.onsuccess=()=>resolve(tx.result!==undefined?tx.result:null);
        tx.onerror=()=>resolve(null);
      }catch(e){resolve(null);}
    });
  });
}
function idbSet(key,val){
  idbOpen().then((db)=>{
    if(!db)return;
    try{db.transaction("kv","readwrite").objectStore("kv").put(val,key);}catch(e){}
  });
}

function persistGetSync(key){
  try{const v=localStorage.getItem(key);if(v!==null)return v;}catch(e){}
  try{const m=document.cookie.match(new RegExp("(?:^|; )"+key+"=([^;]*)"));if(m)return decodeURIComponent(m[1]);}catch(e){}
  return null;
}
function persistSet(key,val){
  try{localStorage.setItem(key,val);}catch(e){}
  try{const d=new Date();d.setFullYear(d.getFullYear()+1);document.cookie=key+"="+encodeURIComponent(val)+"; expires="+d.toUTCString()+"; path=/; SameSite=Lax";}catch(e){}
  idbSet(key,val);
}

function getTimeRange(d){if(d==="thursday")return{start:18*60,end:33*60};return{start:9*60,end:33*60};}
function setNormStart(set,d){if(!set.start)return 0;let m=toMins(set.start);const r=getTimeRange(d);if(m<r.start-12*60)m+=1440;else if(m<r.start&&d!=="thursday")m+=1440;return m;}
function setNormEnd(set,d){if(!set.end)return 0;const sm=setNormStart(set,d);let em=toMins(set.end);const r=getTimeRange(d);if(em<r.start-12*60)em+=1440;else if(em<r.start&&d!=="thursday")em+=1440;if(em<=sm)em+=1440;return em;}

// Festival date mapping (June 2026)
const FEST_DATES={thursday:18,friday:19,saturday:20,sunday:21};
// Returns {day, nowMin} if device clock falls within a festival day window, else null.
function getFestivalNow(){
  const now=new Date();
  if(now.getFullYear()!==2026||now.getMonth()!==5)return null; // month 5 = June
  const date=now.getDate();
  const h=now.getHours(),mi=now.getMinutes();
  const curMin=h*60+mi;
  const order=["thursday","friday","saturday","sunday"];
  for(const d of order){
    const startDate=FEST_DATES[d];
    const r=getTimeRange(d);
    // Same calendar day, after the day's start
    if(date===startDate && curMin>=r.start){
      return {day:d, nowMin:curMin};
    }
    // Early hours of next calendar day, before window end (09:00)
    if(date===startDate+1 && curMin<540){
      return {day:d, nowMin:curMin+1440};
    }
  }
  return null;
}
function isSetPast(set,day,nowMin){
  if(nowMin==null)return false;
  if(!set.end)return false;
  return setNormEnd(set,day)<=nowMin;
}
function renderAvatar(name,size){const c=strColor(name),ini=initials(name);return`<div class="avatar" style="width:${size}px;height:${size}px;background:${c}22;border-color:${c}55;font-size:${Math.floor(size*.35)}px;color:${c};">${ini}</div>`;}
function renderAvatarGroup(artists,size){if(artists.length===1)return renderAvatar(artists[0],size);return`<div class="avatar-group">${artists.slice(0,2).map((a,i)=>`<div style="margin-left:${i>0?-Math.floor(size*.3):0}px;z-index:${3-i};">${renderAvatar(a,size)}</div>`).join("")}</div>`;}

function renderTimeline(){
  const sets=ALL_SETS[activeDay]||[],range=getTimeRange(activeDay),PX=3,LW=118,RH=68,totalW=(range.end-range.start)*PX;
  const hours=[];for(let m=range.start;m<=range.end;m+=60)hours.push(m);
  const hCells=hours.map(m=>`<div class="hour-cell" style="width:${60*PX}px;">${toTime(m%1440)}</div>`).join("");
  const showNow=festNow&&festNow.day===activeDay&&festNow.nowMin>=range.start&&festNow.nowMin<=range.end;
  const nowLeft=showNow?(festNow.nowMin-range.start)*PX:0;
  const nowLine=showNow?`<div class="now-line" style="left:${nowLeft}px;"></div>`:"";
  const rows=STAGES.map(stage=>{
    const stageSets=sets.filter(s=>s.stage===stage.id);
    const blocks=stageSets.map(set=>{
      const st=setNormStart(set,activeDay),en=setNormEnd(set,activeDay),left=(st-range.start)*PX,width=(en-st)*PX;
      if(left+width<0||left>totalW)return"";
      return renderSetBlock(set,left,width);
    }).join("");
    return`<div class="stage-row"><div class="stage-label" style="width:${LW}px;border-right-color:${stage.color};"><span style="color:${stage.color};">${stage.name}</span></div><div class="sets-area" style="width:${totalW}px;height:${RH}px;">${hours.map(m=>`<div style="position:absolute;left:${(m-range.start)*PX}px;top:0;bottom:0;width:1px;background:var(--border-grid);"></div>`).join("")}${nowLine}${blocks}</div></div>`;
  }).join("");
  return`<div class="timeline-wrapper" data-now-left="${showNow?nowLeft:-1}"><div class="timeline-inner"><div class="timeline-header" style="margin-left:${LW}px;">${hCells}</div>${rows}</div></div>`;
}

    let placed=false;
    sorted.forEach(set=>{
      if(liveNow&&!placed&&setNormStart(set,activeDay)>=festNow.nowMin){out+=nowDivider();placed=true;}
      out+=renderFullRow(set,true);
    });
    if(liveNow&&!placed)out+=nowDivider();
    return out+"</div>";
  }
  // Group by stage, each group sorted by start time, stages in canonical order
  let html=sortBar;
  STAGES.forEach(stage=>{
    const stageSets=sets.filter(s=>s.stage===stage.id).sort((a,b)=>setNormStart(a,activeDay)-setNormStart(b,activeDay));
    if(!stageSets.length)return;
    html+=`<div class="full-stage-header" style="color:${stage.color};border-left-color:${stage.color};">${stage.name}</div>`;
    let placed=false;
    stageSets.forEach(set=>{
      if(liveNow&&!placed&&setNormStart(set,activeDay)>=festNow.nowMin){html+=nowDivider();placed=true;}
      html+=renderFullRow(set,true);
    });
  });
  return html;
}
function getDayLabel(d){return{thursday:"THU 18",friday:"FRI 19",saturday:"SAT 20",sunday:"SUN 21"}[d]||d;}

function renderSearchInner(){
  const results=getSearchResults(searchQuery);
  if(!results.length)return`<div style="padding:12px 14px;font-size:11px;color:var(--text-faint);">No results.</div>`;
  const dayKeys=Object.keys(ALL_SETS);
  return results.map(set=>{
    const stage=getStage(set.stage),isSel=selected.has(set.id),label=formatLabel(set,false);
    const dk=dayKeys.find(d=>ALL_SETS[d].some(s=>s.id===set.id))||"";
    const ti=set.start?`${set.start}→${set.end}`:"TBD";
    return`<div class="search-result-item" data-id="${set.id}" data-day="${dk}" data-action="search-toggle">${renderAvatarGroup(set.artists,28)}<div style="flex:1;min-width:0;"><div style="font-size:10px;font-weight:700;color:${isSel?stage.color:"var(--text-mid)"};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</div><div style="font-size:8px;margin-top:2px;"><span style="color:${stage.color};">${stage.name}</span><span style="color:var(--text-faint);margin-left:6px;">${getDayLabel(dk)} · ${ti}</span></div></div><div style="font-size:14px;color:${isSel?"var(--accent)":"var(--text-ghost)"};">${isSel?"✓":"+"}</div></div>`;
  }).join("");
}
function renderSearchResults(){
  return`<div class="search-results" id="searchResults">${renderSearchInner()}</div>`;
}

function renderLegend(){
  if(activeDay==="thursday"||activeView!=="timeline")return"";
  return`<div class="legend">${STAGES.map(s=>`<div class="legend-item"><div class="legend-dot" style="background:${s.color};"></div><span style="font-size:7px;color:${s.color};">${s.name}</span></div>`).join("")}</div>`;
}

function renderThemeSwitch(){
  const opts=[{v:"auto",i:"◐"},{v:"light",i:"☀"},{v:"dark",i:"☾"}];
  return`<div class="theme-switch">${opts.map(o=>`<button class="theme-opt ${themePref===o.v?"active":""}" data-action="theme" data-val="${o.v}" title="${o.v}">${o.i}</button>`).join("")}</div>`;
}

function getEffectiveView(){
  if(activeDay==="thursday"){
    if(activeView==="list")return "list";
    return "full"; // thursday uses full list (timeline not available)
  }
  if(activeView==="list")return "list";
  if(activeView==="full")return "full";
  return "timeline";
}

function render(){
  // Capture scroll positions to restore after re-render
  let savedContentTop=0,savedWrapLeft=0,savedWrapTop=0;
  const oldContent=document.getElementById("mainContent");
  if(oldContent){
    savedContentTop=oldContent.scrollTop;
    const oldWrap=oldContent.querySelector(".timeline-wrapper");
    if(oldWrap){savedWrapLeft=oldWrap.scrollLeft;savedWrapTop=oldWrap.scrollTop;}
  }
  const sets=ALL_SETS[activeDay]||[],selCount=sets.filter(s=>selected.has(s.id)).length,ev=getEffectiveView();
  _nowDividerCount=0;
  let statusText=ev==="list"?`${selCount} sets in your plan`:ev==="full"?`${sets.length} sets in lineup · ${selCount} selected`:`${selCount}/${sets.length} selected`;
  let mainContent=ev==="list"?renderList():ev==="full"?renderFullList():renderTimeline();
  document.getElementById("app").innerHTML=`
    <div class="header">
      <div class="header-top">
        <div class="logo-block">
          <div class="logo-line1"><span class="logo-hive">HIVE</span><span class="logo-fest">FESTIVAL 2026</span></div>
          <div class="logo-line2">FERROPOLIS · 19–21 JUNE</div>
          <div class="logo-line3">unofficial planner by <a href="https://www.instagram.com/chriszeta_raw" target="_blank" rel="noopener" class="logo-link">@chriszeta_raw</a></div>
        </div>
        <div class="header-right">
          ${renderThemeSwitch()}
          <div class="view-btns">
            <button class="view-btn ${activeView==="timeline"?"active":""}${activeDay==="thursday"?" view-btn-hidden":""}" data-action="view" data-val="timeline" ${activeDay==="thursday"?"tabindex=\"-1\" aria-hidden=\"true\"":""}>⊟ GRID</button>
            <button class="view-btn ${activeView==="full"?"active":""}" data-action="view" data-val="full">☰ ALL</button>
            <button class="view-btn ${activeView==="list"?"active":""}" data-action="view" data-val="list">★ MY</button>
          </div>
        </div>
      </div>
      <div class="day-row">
        ${["thursday","friday","saturday","sunday"].map(d=>`<button class="day-btn ${activeDay===d?"active":""}" data-action="day" data-val="${d}">${getDayLabel(d)}</button>`).join("")}
        <div class="action-btns"><button class="action-btn btn-all" data-action="selectAll">ALL</button><button class="action-btn btn-clear" data-action="deselectAll">CLEAR</button></div>
      </div>
    </div>
    <div class="search-bar" id="searchBar">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="Search DJ or artist..." value="${searchQuery}" autocomplete="off">
      ${showSearchResults&&searchQuery.length>=2?renderSearchResults():""}
    </div>
    <div class="statusbar"><span class="statusbar-text">${statusText}</span>${renderLegend()}</div>
    <div class="content" id="mainContent">${mainContent}</div>
  `;
  // Restore scroll positions
  const newContent=document.getElementById("mainContent");
  if(newContent){
    newContent.scrollTop=savedContentTop;
    const newWrap=newContent.querySelector(".timeline-wrapper");
    if(newWrap){newWrap.scrollLeft=savedWrapLeft;newWrap.scrollTop=savedWrapTop;}
  }
  bindEvents();
}

let appClickBound=false;
function bindEvents(){
  if(!appClickBound){
    appClickBound=true;
    document.getElementById("app").addEventListener("click",handleClick);
  }
  const inp=document.getElementById("searchInput");
  if(inp){
    inp.addEventListener("input",e=>{
      searchQuery=e.target.value;
      showSearchResults=searchQuery.length>=2;
      updateSearchDropdown();
    });
    inp.addEventListener("focus",()=>{
      if(searchQuery.length>=2){showSearchResults=true;updateSearchDropdown();}
    });
  }
}

let outsideClickBound=false;
function bindOutsideClick(){
  if(outsideClickBound)return;
  outsideClickBound=true;
  document.addEventListener("click",e=>{
    const bar=document.getElementById("searchBar");
    if(bar&&!bar.contains(e.target)&&showSearchResults){
      showSearchResults=false;
      const dd=document.getElementById("searchResults");
      if(dd)dd.remove();
    }
  });
}

function updateSearchDropdown(){
  const bar=document.getElementById("searchBar");
  if(!bar)return;
  let dd=document.getElementById("searchResults");
  if(showSearchResults&&searchQuery.length>=2){
    if(!dd){
      dd=document.createElement("div");
      dd.id="searchResults";
      dd.className="search-results";
      bar.appendChild(dd);
    }
    dd.innerHTML=renderSearchInner();
  }else if(dd){
    dd.remove();
  }
}

function handleClick(e){
  const el=e.target.closest("[data-action]");if(!el)return;
  const action=el.dataset.action;
  if(action==="theme"){setTheme(el.dataset.val);return;}
  if(action==="view"){activeView=el.dataset.val;render();return;}
  if(action==="day"){activeDay=el.dataset.val;if(activeDay==="thursday"&&activeView==="timeline")activeView="full";render();return;}
  if(action==="selectAll"){(ALL_SETS[activeDay]||[]).forEach(s=>selected.add(s.id));saveSelected();render();return;}
  if(action==="deselectAll"){(ALL_SETS[activeDay]||[]).forEach(s=>selected.delete(s.id));saveSelected();render();return;}
  if(action==="sort"){fullSort=el.dataset.val;render();return;}
  if(action==="toggle"){const id=el.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);saveSelected();render();return;}
  if(action==="remove"){e.stopPropagation();selected.delete(el.dataset.id);saveSelected();render();return;}
  if(action==="search-toggle"){const id=el.dataset.id,dk=el.dataset.day;selected.has(id)?selected.delete(id):selected.add(id);saveSelected();activeDay=dk;showSearchResults=false;searchQuery="";render();return;}
}

loadTheme();
loadSelected();

// Auto-open on current festival day, keeping MY (list) as default view
festNow=getFestivalNow();
if(festNow){
  activeDay=festNow.day;
  activeView="list";
}

render();
bindOutsideClick();
loadSelectedFromIDB();
scrollTimelineToNow();
setTimeout(maybeShowInstall,900);

function scrollTimelineToNow(){
  if(!festNow)return;
  const wrap=document.querySelector(".timeline-wrapper");
  if(wrap){
    const nl=parseFloat(wrap.getAttribute("data-now-left"));
    if(!isNaN(nl)&&nl>=0){
      const target=nl-(wrap.clientWidth-118)/2;
      wrap.scrollLeft=Math.max(0,target);
    }
  }
  // List views: scroll so the "NOW" divider is near the top
  const div=document.getElementById("nowDivider");
  const content=document.getElementById("mainContent");
  if(div&&content){
    const top=div.offsetTop-content.offsetTop-80;
    content.scrollTop=Math.max(0,top);
  }
}

// Refresh "now" state in realtime so past sets dim and the now-line advances
function refreshNow(){
  const prev=festNow?festNow.day+":"+festNow.nowMin:null;
  festNow=getFestivalNow();
  const cur=festNow?festNow.day+":"+festNow.nowMin:null;
  if(prev!==cur)render();
}
setInterval(refreshNow,15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshNow();});
window.addEventListener("focus",refreshNow);
window.addEventListener("pageshow",refreshNow);

if(navigator.storage&&navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}

let deferredPrompt=null;
function isStandalone(){
  return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
}
window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredPrompt=e;
});

function maybeShowInstall(){
  if(isStandalone())return;
  if(persistGetSync("hive_install_off")==="1")return;
  const ios=isIOS();
  const card=document.createElement("div");
  card.className="install-overlay";
  card.id="installOverlay";
  card.innerHTML=`
    <div class="install-card">
      <div class="install-title">📲 INSTALL HIVE PLANNER</div>
      <div class="install-text">Add the planner to your Home Screen to use it offline at the festival, even without signal.</div>
      ${ios?`
        <div class="install-steps">
          1. Tap <b>Share</b> ⎙ at the bottom<br>
          2. Scroll and tap <b>"Add to Home Screen"</b><br>
          3. Confirm with <b>Add</b>
        </div>
        <div class="install-actions">
          <button class="install-btn install-btn-primary" data-install="close">GOT IT</button>
        </div>
      `:`
        <div class="install-actions">
          <button class="install-btn install-btn-primary" data-install="go">INSTALL</button>
          <button class="install-btn install-btn-ghost" data-install="close">LATER</button>
        </div>
      `}
      <button class="install-dismiss" data-install="never">Don't show again</button>
    </div>
  `;
  document.body.appendChild(card);
  card.addEventListener("click",(e)=>{
    const t=e.target.closest("[data-install]");
    if(!t){if(e.target===card)card.remove();return;}
    const act=t.dataset.install;
    if(act==="never"){persistSet("hive_install_off","1");card.remove();return;}
    if(act==="close"){card.remove();return;}
    if(act==="go"){
      if(deferredPrompt){
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(()=>{deferredPrompt=null;card.remove();});
      }else{card.remove();}
    }
  });
}

if("serviceWorker" in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(refreshing)return;
    refreshing=true;
    window.location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then((reg)=>{
      reg.addEventListener("updatefound",()=>{
        const nw=reg.installing;
        if(nw)nw.addEventListener("statechange",()=>{
          if(nw.state==="installed"&&navigator.serviceWorker.controller){nw.postMessage&&nw.postMessage("skip");}
        });
      });
      setInterval(()=>{reg.update().catch(()=>{});},60000);
    }).catch(()=>{});
  });
}
</script>
