function getCurrentTheme(){const ds=document.documentElement.getAttribute("data-theme");return ds==="light"?"light":"dark";}
function getStage(id){if(id==="hive_warmup")return THU_STAGE;return STAGES.find(s=>s.id===id)||STAGES[0];}
function stagesForDay(d){return d==="thursday"?[THU_STAGE]:STAGES;}
function toMins(t){const[h,m]=t.split(":").map(Number);return h*60+m;}
function toTime(m){const h=Math.floor(m/60)%24,mn=m%60;return String(h).padStart(2,"0")+":"+String(mn).padStart(2,"0");}
function strColor(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))&0xffffffff;const hue=Math.abs(h)%360;const light=getCurrentTheme()==="light";return`hsl(${hue},${light?65:60}%,${light?42:50}%)`;}
function initials(name){const p=name.replace(/[^a-zA-Z0-9 ]/g,"").split(" ").filter(Boolean);return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():name.slice(0,2).toUpperCase();}
function formatLabel(set,compact){
  if(!set.type||set.artists.length<2)return compact?set.artists.map(a=>a.split(" ")[0]).join("×"):set.artists.join(", ");
  const baseType=set.type.includes("F2F")?"F2F":set.type.includes("B2B")?"B2B":set.type;
  if(compact)return set.artists.map(a=>a.split(" ")[0]).join("×");
  if(set.artists.length===2)return set.artists[0]+" "+baseType+" "+set.artists[1];
  return set.artists.join(" · ");
}

let _idb=null;
function idbOpen(){
  return new Promise((resolve)=>{
    if(_idb)return resolve(_idb);
    if(!("indexedDB" in window))return resolve(null);
    try{
      const req=indexedDB.open("hive2026",1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv");};
      req.onsuccess=()=>{_idb=req.result;resolve(_idb);};
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null);}
  });
}
function idbGet(key){
  return new Promise((resolve)=>{
    idbOpen().then((db)=>{
      if(!db)return resolve(null);
      try{
        const tx=db.transaction("kv","readonly").objectStore("kv").get(key);
        tx.onsuccess=()=>resolve(tx.result!==undefined?tx.result:null);
        tx.onerror=()=>resolve(null);
      }catch(e){resolve(null);}
    });
  });
}
function idbSet(key,val){
  idbOpen().then((db)=>{
    if(!db)return;
    try{db.transaction("kv","readwrite").objectStore("kv").put(val,key);}catch(e){}
  });
}

function persistGetSync(key){
  try{const v=localStorage.getItem(key);if(v!==null)return v;}catch(e){}
  try{const m=document.cookie.match(new RegExp("(?:^|; )"+key+"=([^;]*)"));if(m)return decodeURIComponent(m[1]);}catch(e){}
  return null;
}
function persistSet(key,val){
  try{localStorage.setItem(key,val);}catch(e){}
  try{const d=new Date();d.setFullYear(d.getFullYear()+1);document.cookie=key+"="+encodeURIComponent(val)+"; expires="+d.toUTCString()+"; path=/; SameSite=Lax";}catch(e){}
  idbSet(key,val);
}

function loadSelected(){

}
function loadSelectedFromIDB(){
  idbGet("hive_selected").then((raw)=>{
    if(!raw)return;
    try{
      const arr=JSON.parse(raw);
      if(Array.isArray(arr)&&arr.length){
        const merged=new Set([...selected,...arr]);
        if(merged.size!==selected.size){selected=merged;render();}
        else if(selected.size===0&&arr.length){selected=new Set(arr);render();}
        persistSet("hive_selected",JSON.stringify(Array.from(selected)));
      }
    }catch(e){}
  });
}

  document.documentElement.setAttribute("data-theme",resolved);
}

function getTimeRange(d){if(d==="thursday")return{start:18*60,end:33*60};return{start:9*60,end:33*60};}
function setNormStart(set,d){if(!set.start)return 0;let m=toMins(set.start);const r=getTimeRange(d);if(m<r.start-12*60)m+=1440;else if(m<r.start&&d!=="thursday")m+=1440;return m;}
function setNormEnd(set,d){if(!set.end)return 0;const sm=setNormStart(set,d);let em=toMins(set.end);const r=getTimeRange(d);if(em<r.start-12*60)em+=1440;else if(em<r.start&&d!=="thursday")em+=1440;if(em<=sm)em+=1440;return em;}

// Festival date mapping (June 2026)
const FEST_DATES={thursday:18,friday:19,saturday:20,sunday:21};
// Returns {day, nowMin} if device clock falls within a festival day window, else null.
function getFestivalNow(){
  const now=new Date();
  if(now.getFullYear()!==2026||now.getMonth()!==5)return null; // month 5 = June
  const date=now.getDate();
  const h=now.getHours(),mi=now.getMinutes();
  const curMin=h*60+mi;
  const order=["thursday","friday","saturday","sunday"];
  for(const d of order){
    const startDate=FEST_DATES[d];
    const r=getTimeRange(d);
    // Same calendar day, after the day's start
    if(date===startDate && curMin>=r.start){
      return {day:d, nowMin:curMin};
    }
    // Early hours of next calendar day, before window end (09:00)
    if(date===startDate+1 && curMin<540){
      return {day:d, nowMin:curMin+1440};
    }
  }
  return null;
}
function isSetPast(set,day,nowMin){
  if(nowMin==null)return false;
  if(!set.end)return false;
  return setNormEnd(set,day)<=nowMin;
}
function renderAvatar(name,size){const c=strColor(name),ini=initials(name);return`<div class="avatar" style="width:${size}px;height:${size}px;background:${c}22;border-color:${c}55;font-size:${Math.floor(size*.35)}px;color:${c};">${ini}</div>`;}
function renderAvatarGroup(artists,size){if(artists.length===1)return renderAvatar(artists[0],size);return`<div class="avatar-group">${artists.slice(0,2).map((a,i)=>`<div style="margin-left:${i>0?-Math.floor(size*.3):0}px;z-index:${3-i};">${renderAvatar(a,size)}</div>`).join("")}</div>`;}

function renderSetBlock(set,leftPx,widthPx){
  const stage=getStage(set.stage),isSel=selected.has(set.id),compact=widthPx<90;
  const label=formatLabel(set,compact);
  const past=festNow&&festNow.day===activeDay&&isSetPast(set,activeDay,festNow.nowMin);
  const bg=isSel?stage.color+"22":"var(--bg-surface)";
  const border=isSel?stage.color:"var(--border)";
  const nameColor=isSel?stage.color:"var(--text-mid)";
  return`<div class="set-block${past?" set-past":""}" data-id="${set.id}"${myFilter?"":` data-action="toggle"`} style="left:${leftPx+2}px;width:${widthPx-4}px;background:${bg};border-color:${border};">
    ${isSel?(myFilter?`<div class="sel-dot sel-dot-x" data-id="${set.id}" data-action="remove" style="background:${stage.color};">×</div>`:`<div class="sel-dot" style="background:${stage.color};">✓</div>`):""}
    <div class="set-block-inner">${renderAvatarGroup(set.artists,compact?18:24)}<div style="min-width:0;flex:1;"><div class="set-name" style="color:${nameColor};">${label}</div>${set.live?`<span class="badge-live">LIVE</span>`:""}</div></div>
    <div class="set-time">${set.start}→${set.end}</div>
  </div>`;
}

function renderTimeline(){
  const allSets=ALL_SETS[activeDay]||[];
  const sets=myFilter?allSets.filter(s=>selected.has(s.id)):allSets;
  if(myFilter&&!sets.length)return emptyMyMessage();
  const range=getTimeRange(activeDay),PX=3,LW=118,RH=68,totalW=(range.end-range.start)*PX;
  const hours=[];for(let m=range.start;m<=range.end;m+=60)hours.push(m);
  const hCells=hours.map(m=>`<div class="hour-cell" style="width:${60*PX}px;">${toTime(m%1440)}</div>`).join("");
  const showNow=festNow&&festNow.day===activeDay&&festNow.nowMin>=range.start&&festNow.nowMin<=range.end;
  const nowLeft=showNow?(festNow.nowMin-range.start)*PX:0;
  const nowLine=showNow?`<div class="now-line" style="left:${nowLeft}px;"></div>`:"";
  // In MY mode, only show stages that have at least one selected set
  const dayStages=stagesForDay(activeDay);
  const stageList=myFilter?dayStages.filter(st=>sets.some(s=>s.stage===st.id)):dayStages;
  const rows=stageList.map(stage=>{
    const stageSets=sets.filter(s=>s.stage===stage.id);
    const blocks=stageSets.map(set=>{
      const st=setNormStart(set,activeDay),en=setNormEnd(set,activeDay),left=(st-range.start)*PX,width=(en-st)*PX;
      if(left+width<0||left>totalW)return"";
      return renderSetBlock(set,left,width);
    }).join("");
    return`<div class="stage-row"><div class="stage-label" style="width:${LW}px;border-right-color:${stage.color};"><span style="color:${stage.color};">${stage.name}</span></div><div class="sets-area" style="width:${totalW}px;height:${RH}px;">${hours.map(m=>`<div style="position:absolute;left:${(m-range.start)*PX}px;top:0;bottom:0;width:1px;background:var(--border-grid);"></div>`).join("")}${nowLine}${blocks}</div></div>`;
  }).join("");
  return`<div class="timeline-wrapper" data-now-left="${showNow?nowLeft:-1}"><div class="timeline-inner"><div class="timeline-header" style="margin-left:${LW}px;">${hCells}</div>${rows}</div></div>`;
}

}

function renderFullList(){
  const allSets=ALL_SETS[activeDay]||[];
  const sets=myFilter?allSets.filter(s=>selected.has(s.id)):allSets;
  if(myFilter&&!sets.length)return emptyMyMessage();
  const sortBar=`<div class="sort-bar">
    <span class="sort-label">SORT:</span>
    <button class="sort-btn ${fullSort==="time"?"active":""}" data-action="sort" data-val="time">TIME</button>
    <button class="sort-btn ${fullSort==="stage"?"active":""}" data-action="sort" data-val="stage">STAGE</button>
  </div>`;

  const liveNow=festNow&&festNow.day===activeDay;

  if(fullSort==="time"){
    const sorted=[...sets].sort((a,b)=>setNormStart(a,activeDay)-setNormStart(b,activeDay));
    let out=sortBar+"<div>";
    let placed=false;
    sorted.forEach(set=>{
      if(liveNow&&!placed&&setNormStart(set,activeDay)>=festNow.nowMin){out+=nowDivider();placed=true;}
      out+=renderFullRow(set,true);
    });
    if(liveNow&&!placed)out+=nowDivider();
    return out+"</div>";
  }
  // Group by stage, each group sorted by start time, stages in canonical order
  let html=sortBar;
  stagesForDay(activeDay).forEach(stage=>{
    const stageSets=sets.filter(s=>s.stage===stage.id).sort((a,b)=>setNormStart(a,activeDay)-setNormStart(b,activeDay));
    if(!stageSets.length)return;
    html+=`<div class="full-stage-header" style="color:${stage.color};border-left-color:${stage.color};">${stage.name}</div>`;

  if(action==="toggle"){const id=el.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);saveSelected();render();return;}

}

const DAILY_MESSAGES={

// Decides which daily-message id should show right now, or null.
function getDailyMessageId(){
  const fn=getFestivalNow();
  if(fn)return fn.day;            // live festival day (respects the 09:00 window)
  // Thursday warmup starts at 18:00 in the timeline, but the daily message should be
  // available from 14:00. Handle that window explicitly.
  const now=new Date();
  if(now.getFullYear()===2026&&now.getMonth()===5){
    const curMin=now.getHours()*60+now.getMinutes();
    if(now.getDate()===FEST_DATES.thursday&&curMin>=840&&curMin<18*60)return "thursday";
  }
  if(isAfterFestival())return "after";
  return null;
}

// Production: festival is 18-21 June 2026, so "after" = from 22 June onward.
function isAfterFestival(){
  const now=new Date();
  if(now.getFullYear()>2026)return true;
  if(now.getFullYear()<2026)return false;
  if(now.getMonth()>5)return true;   // after June
  if(now.getMonth()<5)return false;
  return now.getDate()>=22;          // 22 June or later (day after Sunday-21 window)
}

function mapClamp(){
  const stage=document.getElementById("mapStage"),c=document.getElementById("mapContent");if(!stage||!c||!_map)return;
  const sw=stage.clientWidth,sh=stage.clientHeight,bw=c.offsetWidth,bh=c.offsetHeight;

  const s0=_map.scale,s1=Math.max(_map.min,Math.min(_map.max,newScale));

}

  const cx=50,cy=50,rx=35+Math.random()*5,ry=31+Math.random()*5;
  const n=18,start=Math.random()*Math.PI*2,turn=Math.PI*2*1.08;const pts=[];
  for(let i=0;i<=n;i++){const a=start+turn*(i/n),jr=1+(Math.random()*0.12-0.06);pts.push([cx+Math.cos(a)*rx*jr,cy+Math.sin(a)*ry*jr]);}
  let d="M"+pts[0][0].toFixed(1)+" "+pts[0][1].toFixed(1);
  for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;d+=" Q"+pts[i][0].toFixed(1)+" "+pts[i][1].toFixed(1)+" "+mx.toFixed(1)+" "+my.toFixed(1);}
  return d;
}
function mapClearCircle(){const b=document.getElementById("mapHilite");if(b)b.innerHTML="";}
function mapDrawSet(items,sw){
  sw=sw||[2.7,1.8];
  const box=document.getElementById("mapHilite"),c=document.getElementById("mapContent");
  if(!box||!c){return;}
  if(!items||!items.length){box.innerHTML="";return;}
  const cw=c.offsetWidth;let html="";
  items.forEach(it=>{
    const size=Math.max(36,cw*it[2]),rot=(Math.random()*16-8).toFixed(1);
    html+=`<svg class="map-circle" style="left:${it[0]}%;top:${it[1]}%;width:${size}px;height:${size}px;--rot:${rot}deg;" viewBox="0 0 100 100"><path d="${roughCircle()}" stroke-width="${sw[0]}"></path><path d="${roughCircle()}" stroke-width="${sw[1]}" opacity="0.78"></path></svg>`;
  });
  box.innerHTML=html;
  box.querySelectorAll("svg").forEach((svg,gi)=>{
    svg.querySelectorAll("path").forEach((pa,pi)=>{
      try{const L=pa.getTotalLength();pa.style.strokeDasharray=L;pa.style.strokeDashoffset=L;pa.getBoundingClientRect();
        pa.style.transition="stroke-dashoffset 0.45s ease";pa.style.transitionDelay=(Math.min(gi*0.05,0.55)+pi*0.1)+"s";pa.style.strokeDashoffset="0";}catch(e){}
    });
  });
}
function updateChipActives(){
  const sel=_map&&_map.sel;
  document.querySelectorAll(".map-chip[data-chip]").forEach(c=>c.classList.toggle("active",!!sel&&sel.kind==="stage"&&sel.id===c.dataset.chip));
  document.querySelectorAll(".map-chip[data-amenity]").forEach(c=>c.classList.toggle("active",!!sel&&sel.kind==="amenity"&&sel.id===c.dataset.amenity));
}
function clearSel(){if(_map)_map.sel=null;updateChipActives();mapClearCircle();}
function selectStage(id){
  if(!_map||_map.tab!=="infield")return;
  if(_map.sel&&_map.sel.kind==="stage"&&_map.sel.id===id){clearSel();return;}
  _map.sel={kind:"stage",id:id};updateChipActives();
  const p=STAGE_POS[id],c=document.getElementById("mapContent");if(!p||!c)return;
  const cw=c.offsetWidth,ch=c.offsetHeight,s=2.0;
  const ox=(p[0]/100*cw)-cw/2,oy=(p[1]/100*ch)-ch/2;
  _map.scale=s;_map.tx=-ox*s;_map.ty=-oy*s;mapClamp();
  c.style.transition="transform 0.38s ease";mapApply();
  setTimeout(()=>{const cc=document.getElementById("mapContent");if(cc)cc.style.transition="";},430);
  mapDrawSet([[p[0],p[1],(STAGE_SIZE[id]||0.17)]],[3.6,2.3]);
}
function selectAmenity(type){
  if(!_map)return;
  if(_map.sel&&_map.sel.kind==="amenity"&&_map.sel.id===type){clearSel();return;}
  _map.sel={kind:"amenity",id:type};updateChipActives();
  _map.scale=1;_map.tx=0;_map.ty=0;
  const c=document.getElementById("mapContent");
  if(c){c.style.transition="transform 0.3s ease";mapApply();setTimeout(()=>{const cc=document.getElementById("mapContent");if(cc)cc.style.transition="";},340);}
  mapDrawSet((AMEN[_map.tab]&&AMEN[_map.tab][type])||[],[5.6,3.6]);
}
function mapSwitch(tab){
  if(!_map||_map.tab===tab)return;
  _map.tab=tab;_map.scale=1;_map.tx=0;_map.ty=0;
  const img=document.getElementById("mapImg");if(img){img.src=MAP_IMAGES[tab];img.alt="Festival map - "+tab;}
  document.querySelectorAll(".map-tab").forEach(b=>b.classList.toggle("active",b.dataset.mapTab===tab));
  const sc=document.getElementById("mapStageChips");if(sc)sc.style.display=tab==="infield"?"flex":"none";
  resizeMapContent();
  if(_map.sel&&_map.sel.kind==="amenity"){updateChipActives();mapDrawSet((AMEN[tab]&&AMEN[tab][_map.sel.id])||[],[5.6,3.6]);}
  else{_map.sel=null;updateChipActives();mapClearCircle();}
}
function bindMapOverlay(ov){
  const stage=ov.querySelector("#mapStage"),hint=ov.querySelector("#mapHint");
  ov.addEventListener("click",e=>{
    if(e.target.closest("[data-map-close]"))return closeMapOverlay();
    const tab=e.target.closest("[data-map-tab]");if(tab)return mapSwitch(tab.dataset.mapTab);
    const ac=e.target.closest("[data-amenity]");if(ac)return selectAmenity(ac.dataset.amenity);
    const stg=e.target.closest("[data-chip]");if(stg)return selectStage(stg.dataset.chip);
  });
  let hideHint=()=>{if(hint){hint.classList.add("hide");hideHint=()=>{};}};
  let pts=new Map(),startDist=0,startScale=1,lastTap=0,panX=0,panY=0,baseTx=0,baseTy=0;
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
  function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
  stage.addEventListener("touchstart",e=>{
    hideHint();
    for(const t of e.changedTouches)pts.set(t.identifier,{x:t.clientX,y:t.clientY});
    const arr=[...pts.values()];
    if(arr.length===2){startDist=dist(arr[0],arr[1])||1;startScale=_map.scale;}
    else if(arr.length===1){panX=arr[0].x;panY=arr[0].y;baseTx=_map.tx;baseTy=_map.ty;
      const now=Date.now();if(now-lastTap<300){mapZoomTo(_map.scale>1.2?1:2.6,arr[0].x,arr[0].y);lastTap=0;}else lastTap=now;}
  },{passive:false});
  stage.addEventListener("touchmove",e=>{
    e.preventDefault();
    for(const t of e.changedTouches){if(pts.has(t.identifier))pts.set(t.identifier,{x:t.clientX,y:t.clientY});}
    const arr=[...pts.values()];
    if(arr.length===2){const d=dist(arr[0],arr[1]),m=mid(arr[0],arr[1]);mapZoomTo(startScale*(d/startDist),m.x,m.y);}
    else if(arr.length===1&&_map.scale>1){_map.tx=baseTx+(arr[0].x-panX);_map.ty=baseTy+(arr[0].y-panY);mapClamp();mapApply();}
  },{passive:false});
  function endTouch(e){for(const t of e.changedTouches)pts.delete(t.identifier);
    const arr=[...pts.values()];if(arr.length===1){panX=arr[0].x;panY=arr[0].y;baseTx=_map.tx;baseTy=_map.ty;}}
  stage.addEventListener("touchend",endTouch);stage.addEventListener("touchcancel",endTouch);
  stage.addEventListener("wheel",e=>{e.preventDefault();hideHint();mapZoomTo(_map.scale*(e.deltaY<0?1.15:0.87),e.clientX,e.clientY);},{passive:false});
  let dragging=false,mx=0,my=0,mtx=0,mty=0;
  stage.addEventListener("mousedown",e=>{if(_map.scale<=1)return;dragging=true;mx=e.clientX;my=e.clientY;mtx=_map.tx;mty=_map.ty;});
  window.addEventListener("mousemove",e=>{if(!dragging||!_map)return;_map.tx=mtx+(e.clientX-mx);_map.ty=mty+(e.clientY-my);mapClamp();mapApply();});
  window.addEventListener("mouseup",()=>{dragging=false;});
  document.addEventListener("keydown",function esc(ev){if(ev.key==="Escape"){closeMapOverlay();document.removeEventListener("keydown",esc);}});
}

</script>
